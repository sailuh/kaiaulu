# https://github.com/chaoss/grimoirelab-perceval
perceval: /Library/Frameworks/Python.framework/Versions/3.12/bin/perceval
# https://github.com/multilang-depends/depends
depends: ~/depends-0.9.6/depends.jar
# https://github.com/tsantalis/RefactoringMiner#running-refactoringminer-from-the-command-line
refactoring_miner: ~/RefactoringMiner-1.0/bin/RefactoringMiner
# https://github.com/boyter/scc
scc: ~/scc/scc
# universal-ctags
utags: /usr/local/Cellar/universal-ctags/HEAD-62f0144/bin/ctags
# https://archdia.com/
dv8: /Applications/DV84/bin/dv8-console
# OSLOM: http://oslom.org/
oslom_dir: ~/OSLOM2/oslom_dir
oslom_undir: ~/OSLOM2/oslom_undir
# srcML: https://www.srcml.org/
srcml: /usr/local/bin/srcml
# pattern4: https://users.encs.concordia.ca/~nikolaos/pattern_detection.html
pattern4: ~/Desktop/kaiaulu/tools/pattern4.jar
# Scitools Understand: https://scitools.com/
scitools: /Applications/Understand.app/Contents/MacOS/und
# Temporary folder path for intermediate files
tmp: /tmp
# https://github.com/sailuh/sentiment_classifier
pysenti: ../../haotian_sentiment_classifier/exec/train_or_predict.py
# The name of the conda env pysenti is setup if pysenti is deployed on conda env
pysenti_conda_env_name: sentiment_classifier
# to access third party tools located in a conda environment. NOT for kaiaulu. see bash_profile for conda path. which conda may not suffice.
conda: /opt/miniconda3/bin/conda
