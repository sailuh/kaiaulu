# -*- yaml -*-
# https://github.com/sailuh/kaiaulu
#
# Module Manifest #
#
# Declares what the git module (R/git.R) reads from the configuration and
# what it produces. check_config(config, "git") uses the `reads` section to
# report missing entries before a notebook runs. The `produces` section
# documents the tables of this module for the data schema.

module: git
r_file: R/git.R

reads:
  version_control.log:
    description: Path to the .git of the project repository.
    type: path
    required: true
    getter: get_git_repo_path
    how_to_fill: git clone the repository at version_control.log_url
  version_control.branch:
    description: Branches used for analysis.
    type: list
    required: true
    getter: get_git_branches
  conventions.source_extensions:
    description: File extensions of the project's source code.
    type: list
    required: false
    getter: get_file_extensions
  conventions.test_paths:
    description: Substrings that identify test files.
    type: list
    required: false
    getter: get_substring_filepath
  filter.max_files_per_commit:
    description: Remove commits that change more than this number of files.
    type: integer
    required: false
    getter: get_filter_commit_size
  period:
    description: Name of the period to analyze, defined under periods in the project file.
    type: text
    required: false
    getter: get_period

tools:
  - perceval

produces:
  tables:
    gitlog:
      function: parse_gitlog
      columns:
        - author_name_email
        - author_datetimetz
        - commit_hash
        - committer_name_email
        - committer_datetimetz
        - commit_message
        - file_pathname
        - lines_added
        - lines_removed
        - file_pathname_renamed
      joins:
        author_name_email: identity
        file_pathname: src
